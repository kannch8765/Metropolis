name: Apply approved Task 029

on:
  push:
    branches:
      - agent/map-real-resources

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'chore: run Task 029 owner gate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "196e7b432b6c0bc9b745e9b9e43639318f686c8c"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply approved changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "apps/web/src/components/ResourceMap.tsx",
              "import type { Resource } from '@metropolis/schema';\n",
              "import type { Resource } from '@metropolis/schema';\nimport { openMarkerPopup, popupContent } from './resourceMapUtils';\n",
          )
          replace_exact(
              "apps/web/src/components/ResourceMap.tsx",
              '''function popupContent(resource: Resource): HTMLElement {
            const root = document.createElement('div');
            root.className = 'map-popup';

            const kind = document.createElement('small');
            kind.textContent = resource.kind.replaceAll('_', ' ');
            root.append(kind);

            const title = document.createElement('strong');
            title.textContent = resource.name;
            root.append(title);

            const detail = document.createElement('span');
            detail.textContent = `${resource.wardId} · ${resource.languages.join(', ') || 'language not specified'}`;
            root.append(detail);

            return root;
          }

          ''',
              "",
          )
          replace_exact(
              "apps/web/src/components/ResourceMap.tsx",
              "      attributionControl: true,\n",
              "",
          )
          replace_exact(
              "apps/web/src/components/ResourceMap.tsx",
              "    marker.togglePopup();\n",
              "    openMarkerPopup(marker);\n",
          )

          Path("apps/web/src/components/resourceMapUtils.ts").write_text(
              '''import type { Marker } from 'maplibre-gl';
          import type { Resource } from '@metropolis/schema';

          export function popupContent(resource: Resource): HTMLElement {
            const root = document.createElement('div');
            root.className = 'map-popup';

            const kind = document.createElement('small');
            kind.textContent = resource.kind.replaceAll('_', ' ');
            root.appendChild(kind);

            const title = document.createElement('strong');
            title.textContent = resource.name;
            root.appendChild(title);

            const detail = document.createElement('span');
            detail.textContent = `${resource.wardId} · ${resource.languages.join(', ') || 'language not specified'}`;
            root.appendChild(detail);

            const sourceLink = document.createElement('a');
            sourceLink.textContent = 'View source';
            sourceLink.href = resource.sourceUrl;
            sourceLink.target = '_blank';
            sourceLink.rel = 'noreferrer';
            root.appendChild(sourceLink);

            return root;
          }

          export function openMarkerPopup(marker: Pick<Marker, 'getPopup' | 'togglePopup'>): void {
            const popup = marker.getPopup();
            if (!popup || !popup.isOpen()) marker.togglePopup();
          }
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          Path("apps/web/src/vite-env.d.ts").write_text(
              '/// <reference types="vite/client" />\n', encoding="utf-8"
          )

          replace_exact(
              "pipelines/sources/itabashi_events.py",
              "import hashlib\n",
              "import hashlib\nimport io\n",
          )
          replace_exact(
              "pipelines/sources/itabashi_events.py",
              '        row.get(key, "") for key in ("NO", "イベント名", "開始日", "場所名称", "住所")\n',
              '        row.get(key, "") or "" for key in ("NO", "イベント名", "開始日", "場所名称", "住所")\n',
          )
          replace_exact(
              "pipelines/sources/itabashi_events.py",
              "    return resources\n\n\ndef parse_csv",
              "    return sorted(resources, key=lambda resource: (resource.name, resource.id))\n\n\ndef parse_csv",
          )
          replace_exact(
              "pipelines/sources/itabashi_events.py",
              "    return normalize_rows(csv.DictReader(text.splitlines()), source_updated_at)\n",
              "    return normalize_rows(csv.DictReader(io.StringIO(text)), source_updated_at)\n",
          )
          replace_exact(
              "pipelines/sources/itabashi_events.py",
              '    statements = ["BEGIN;"]\n    for resource in resources:\n',
              '    statements: list[str] = []\n    for resource in sorted(resources, key=lambda item: (item.name, item.id)):\n',
          )
          replace_exact(
              "pipelines/sources/itabashi_events.py",
              '    statements.append("COMMIT;")\n    return "\\n".join(statements) + "\\n"\n',
              '    return "\\n".join(statements) + "\\n"\n',
          )

          replace_exact(
              "pipelines/tests/test_itabashi_events.py",
              "from pipelines.sources.itabashi_events import parse_csv, to_d1_sql\n",
              "from pipelines.sources.itabashi_events import decode_csv, parse_csv, to_d1_sql\n",
          )
          replace_exact(
              "pipelines/tests/test_itabashi_events.py",
              '''        self.assertIn("https://example.org/japanese", sql)


          if __name__ == "__main__":
          ''',
              '''        self.assertIn("https://example.org/japanese", sql)
              self.assertNotIn("BEGIN", sql)
              self.assertNotIn("COMMIT", sql)

              def test_cp932_and_stable_order_are_supported(self) -> None:
                  self.assertEqual(decode_csv("板橋区".encode("cp932")), "板橋区")
                  fixture = FIXTURE.read_text(encoding="utf-8")
                  self.assertEqual(
                      parse_csv(fixture, "2026-02-10"),
                      parse_csv(
                          "\\n".join(fixture.splitlines()[0:1] + fixture.splitlines()[1:][::-1]),
                          "2026-02-10",
                      ),
                  )


          if __name__ == "__main__":
          '''.replace("          ", ""),
          )

          Path("pnpm-workspace.yaml").write_text(
              '''packages:
            - apps/*
            - packages/*
          allowBuilds:
            esbuild: true
            sharp: true
            workerd: true
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          Path("docs/verify-resource-map.mjs").write_text(
              '''import assert from 'node:assert/strict';
          import { openMarkerPopup, popupContent } from '../apps/web/src/components/resourceMapUtils.ts';

          class FakeElement {
            children = [];
            className = '';
            textContent = '';
            href = '';
            target = '';
            rel = '';

            appendChild(child) {
              this.children.push(child);
              return child;
            }
          }

          globalThis.document = {
            createElement: () => new FakeElement(),
          };

          const resource = {
            id: 'fixture-resource',
            kind: 'japanese_class',
            name: 'Japanese class',
            description: 'Fixture',
            latitude: 35.75,
            longitude: 139.7,
            wardId: 'itabashi',
            languages: ['ja'],
            audiences: [],
            accessibilityTags: [],
            startAt: null,
            endAt: null,
            costType: 'free',
            sourceUrl: 'https://example.org/source',
            sourceUpdatedAt: '2026-07-18',
          };

          const popup = popupContent(resource);
          const sourceLink = popup.children.at(-1);
          assert.equal(sourceLink.textContent, 'View source');
          assert.equal(sourceLink.href, resource.sourceUrl);
          assert.equal(sourceLink.target, '_blank');
          assert.equal(sourceLink.rel, 'noreferrer');

          let toggleCount = 0;
          let popupOpen = false;
          const marker = {
            getPopup: () => ({ isOpen: () => popupOpen }),
            togglePopup: () => {
              toggleCount += 1;
              popupOpen = !popupOpen;
            },
          };

          marker.togglePopup();
          openMarkerPopup(marker);
          assert.equal(toggleCount, 1, 'marker click must not immediately close its popup');
          assert.equal(popupOpen, true);

          popupOpen = false;
          openMarkerPopup(marker);
          assert.equal(toggleCount, 2, 'card selection must open a closed popup');
          assert.equal(popupOpen, true);

          console.log('PASS: popup source link and marker popup open-state harness');
          '''.replace("          ", ""),
              encoding="utf-8",
          )
          PY

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
          node --experimental-strip-types docs/verify-resource-map.mjs
          python -m unittest discover -s pipelines/tests -v
          python -m compileall pipelines
          git diff --check

      - name: Commit verified owner-gate result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/ResourceMap.tsx \
            apps/web/src/components/resourceMapUtils.ts \
            apps/web/src/vite-env.d.ts \
            docs/verify-resource-map.mjs \
            pipelines/sources/itabashi_events.py \
            pipelines/tests/test_itabashi_events.py \
            pnpm-lock.yaml \
            pnpm-workspace.yaml
          git rm .github/workflows/apply-task-029.yml
          git commit -m "verify Metropolis PR #3 vertical slice"
          git push origin HEAD:agent/map-real-resources
